<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>디지털 게시판 — 클라이언트 플레이어</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }

/* 대기 화면 */
.standby {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
  color: white;
  z-index: 100;
  transition: opacity 0.5s;
}
.standby.hidden { opacity: 0; pointer-events: none; }
.standby .logo { font-size: 64px; margin-bottom: 16px; }
.standby h1 { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
.standby .status { font-size: 14px; color: #aaa; margin-bottom: 20px; }
.standby .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
.dot-green { background: #7fdb8a; }
.dot-yellow { background: #f5a623; }
.dot-red { background: #e74c3c; }

/* 설정 패널 */
.config-panel {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  padding: 20px;
  width: 320px;
}
.config-panel label { display: block; font-size: 12px; color: #aaa; margin-bottom: 4px; }
.config-panel input, .config-panel select {
  width: 100%; padding: 8px 12px;
  background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
  border-radius: 6px; color: white; font-size: 14px;
  margin-bottom: 12px;
}
.config-panel button {
  width: 100%; padding: 10px;
  background: #1a73e8; color: white; border: none;
  border-radius: 6px; font-size: 14px; font-weight: 600;
  cursor: pointer;
}
.config-panel button:hover { background: #1557b0; }

/* 플레이어 영역 */
.player-container {
  position: fixed; inset: 0;
  display: none;
  background: #000;
}
.player-container.active { display: flex; }
.player-container.single { flex-direction: column; }
.player-container.dual { flex-direction: row; }

.screen {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}
.screen img, .screen video {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}
/* 전환 레이어 */
.layer { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.layer.t-fade { opacity: 0; transition: opacity 0.8s ease; }
.layer.t-fade.active { opacity: 1; }
.layer.t-fade.leaving { opacity: 0; }
.layer.t-cut { opacity: 1; }
.layer.t-slide { transform: translateX(100%); transition: transform 0.7s cubic-bezier(.4,0,.2,1); }
.layer.t-slide.active { transform: translateX(0); }
.layer.t-slide.leaving { transform: translateX(-100%); }
.layer.t-dissolve { opacity: 0; filter: blur(12px); transition: opacity 1s ease, filter 1s ease; }
.layer.t-dissolve.active { opacity: 1; filter: blur(0); }
.layer.t-dissolve.leaving { opacity: 0; filter: blur(12px); }
.layer.t-wipe { clip-path: inset(0 100% 0 0); transition: clip-path 0.8s ease; }
.layer.t-wipe.active { clip-path: inset(0 0 0 0); }
.layer.t-flip { opacity: 0; transform: perspective(1200px) rotateY(90deg); transition: transform 0.7s ease, opacity 0.7s ease; }
.layer.t-flip.active { opacity: 1; transform: perspective(1200px) rotateY(0deg); }
.layer.t-flip.leaving { opacity: 0; transform: perspective(1200px) rotateY(-90deg); }
.layer.t-zoom { opacity: 0; transition: opacity 1s ease; }
.layer.t-zoom.active { opacity: 1; }
.layer.t-zoom.leaving { opacity: 0; }
.layer.t-zoom.active img, .layer.t-zoom.active video { animation: kenburns var(--kb, 12s) ease-out forwards; }
@keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.18); } }

/* 오버레이 정보 (좌상단) */
.info-overlay {
  position: fixed;
  top: 10px; left: 10px;
  background: rgba(0,0,0,0.7);
  color: #7fdb8a;
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 11px;
  z-index: 200;
  opacity: 0;
  transition: opacity 0.3s;
}
.info-overlay.visible { opacity: 1; }

/* 전체화면 버튼 */
.fullscreen-btn {
  position: fixed;
  top: 10px; right: 10px;
  background: rgba(0,0,0,0.7);
  color: white;
  border: none;
  padding: 8px 14px;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
  z-index: 200;
}
.fullscreen-btn:hover { background: rgba(255,255,255,0.2); }

/* ═══════════════════════════════════════════════════════
   라이브 레이어 — 폰에서 올린 사진을 편성표 "위에" 띄운다.
   (client/player.html 의 라이브 레이어와 같은 동작. 두 플레이어는
    원래 독립 파일이라 전환 CSS 처럼 각자 사본을 갖는다)
   ═══════════════════════════════════════════════════════ */
#live-layer { position: fixed; inset: 0; z-index: 150; display: none; pointer-events: none; }
#live-layer.on { display: block; }

#live-stage {
  position: absolute; inset: 0;
  background: #000;
  overflow: hidden;
  border-radius: 0;
  transform-origin: 100% 100%;
  transition: transform 0.9s cubic-bezier(.4,0,.2,1), border-radius 0.9s ease,
              box-shadow 0.9s ease, opacity 0.7s ease;
}
#live-stage.corner {
  transform: translate(-2.2vw, -2.2vh) scale(0.27);
  border-radius: 40px;
  box-shadow: 0 30px 90px rgba(0,0,0,0.75), 0 0 0 4px rgba(255,255,255,0.16);
}
#live-stage.gone { opacity: 0; }

.lphoto { position: relative; overflow: hidden; background: #000; }
.lphoto .lbg {
  position: absolute; inset: -10%;
  background-size: cover; background-position: center;
  filter: blur(30px) brightness(0.4);
  transform: scale(1.08);
}
.lphoto img { position: relative; width: 100%; height: 100%; object-fit: contain; display: block; }
.lphoto .lcap {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.86) 10%, rgba(0,0,0,0));
  color: #fff;
  font-family: 'Malgun Gothic', 'Segoe UI', sans-serif;
  font-weight: 700;
  line-height: 1.35;
  word-break: keep-all;
  text-shadow: 0 2px 16px rgba(0,0,0,0.85);
}

#live-hero {
  position: absolute; inset: 0; z-index: 2;
  opacity: 0;
  transition: opacity 0.45s ease, transform 0.7s cubic-bezier(.4,0,.2,1);
}
#live-hero.in { opacity: 1; }
#live-hero.out { opacity: 0; transform: scale(0.93); }
#live-hero .lphoto { width: 100%; height: 100%; }
#live-hero .lcap {
  font-size: 3vw;
  padding: 2.4vh 4vw 3.4vh;
  border-left: 0.45vw solid #4c8dff;
  margin-left: 3.2vw;
  padding-left: 2vw;
}

#live-grid {
  position: absolute; inset: 0; z-index: 1;
  display: grid; gap: 0.5vh;
  background: #000;
  opacity: 0;
  transition: opacity 0.55s ease;
}
#live-grid.in { opacity: 1; }
#live-grid[data-n="1"] { grid-template-columns: 1fr; grid-template-rows: 1fr; }
#live-grid[data-n="2"] { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
#live-grid[data-n="3"] { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
#live-grid[data-n="3"] .lphoto:first-child { grid-row: span 2; }
#live-grid[data-n="4"] { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
#live-grid .lphoto .lcap { font-size: 1.5vw; padding: 5% 6% 6%; }
#live-grid[data-n="1"] .lphoto .lcap { font-size: 3vw; padding: 2.4vh 4vw 3.4vh; }
#live-grid[data-n="2"] .lphoto .lcap { font-size: 2vw; padding: 4% 7% 5%; }
#live-grid[data-n="3"] .lphoto:first-child .lcap { font-size: 2vw; }
@keyframes lpop { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
#live-grid .lphoto.pop { animation: lpop 0.55s cubic-bezier(.2,.8,.2,1) both; }

#live-badge {
  position: absolute; top: 3vh; left: 3vw; z-index: 3;
  display: flex; align-items: center; gap: 0.8vw;
  background: rgba(231,76,60,0.94);
  color: #fff;
  font-family: 'Segoe UI', sans-serif; font-weight: 800;
  font-size: 1.4vw; letter-spacing: 0.14em;
  padding: 0.8vh 1.6vw; border-radius: 100px;
  box-shadow: 0 6px 22px rgba(0,0,0,0.45);
}
#live-badge .rec {
  width: 0.85vw; height: 0.85vw; border-radius: 50%; background: #fff;
  animation: recblink 1.4s ease-in-out infinite;
}
@keyframes recblink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
#live-stage.corner #live-badge { font-size: 4.4vw; padding: 2.6vh 5.4vw; gap: 2.4vw; border-radius: 400px; }
#live-stage.corner #live-badge .rec { width: 2.9vw; height: 2.9vw; }

#live-flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 190; }
#live-flash.fire { animation: lflash 0.5s ease-out; }
@keyframes lflash { 0% { opacity: 0; } 12% { opacity: 0.9; } 100% { opacity: 0; } }
</style>
</head>
<body>

<!-- 대기/설정 화면 -->
<div class="standby" id="standby">
  <div class="logo">📺</div>
  <h1>디지털 게시판</h1>
  <div class="status" id="statusText">
    <span class="dot dot-yellow"></span> 설정 대기 중
  </div>
  <div class="config-panel">
    <label>클라이언트 이름</label>
    <input type="text" id="cfgName" value="웹테스트" placeholder="예: 현관, 식당">
    <label>모니터 모드</label>
    <select id="cfgMonitors">
      <option value="1">1대 (순차 재생)</option>
      <option value="2">2대 (좌/우 동시)</option>
    </select>
    <label>호스트 URL (자동 감지됨)</label>
    <input type="text" id="cfgHost" readonly>
    <button onclick="connectToHost()">▶ 연결 및 재생 시작</button>
    <a href="/downloads/signage-client.zip" download
       style="display:block; text-align:center; margin-top:14px; padding:10px; background:rgba(255,255,255,0.08); color:#7fdb8a; text-decoration:none; border:1px solid rgba(127,219,138,0.35); border-radius:6px; font-size:13px;">
      💻 PC 전용 클라이언트 다운로드 (전체화면 키오스크)
    </a>
    <div style="text-align:center; font-size:11px; color:#888; margin-top:8px;">
      압축 해제 후 install.bat 실행 → 자동 설치·부팅 시 자동 실행
    </div>
    <div style="text-align:center; font-size:10px; color:#e0a066; margin-top:6px; line-height:1.5;">
      ⚠ Win11에서 차단 시: zip 우클릭 → 속성 → 차단 해제 후 압축 해제.<br>
      그래도 막히면 스마트 앱 제어 끄기 (동봉 사용설명서 참고)
    </div>
  </div>
</div>

<!-- 플레이어 -->
<div class="player-container" id="playerContainer">
  <div class="screen" id="screen1"></div>
  <div class="screen" id="screen2" style="display:none;"></div>
</div>

<!-- 라이브 레이어 (폰 촬영 사진) -->
<div id="live-layer">
  <div id="live-stage">
    <div id="live-grid"></div>
    <div id="live-hero"></div>
    <div id="live-badge"><span class="rec"></span>LIVE</div>
  </div>
</div>
<div id="live-flash"></div>

<!-- 오버레이 -->
<div class="info-overlay" id="infoOverlay"></div>
<button class="fullscreen-btn" id="fsBtn" style="display:none;" onclick="toggleFullscreen()">⛶ 전체화면</button>

<script>
// ─── 상태 ────────────────────────────────────────────────
let ws = null;
let clientId = localStorage.getItem('web_client_id') || crypto.randomUUID();
localStorage.setItem('web_client_id', clientId);

let monitors = 1;
let playlist = [];
let currentIndex = 0;
let playTimer = null;
let isPlaying = false;
let hostBaseUrl = '';

// URL 파라미터에서 이름 가져오기
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('name')) {
  document.getElementById('cfgName').value = urlParams.get('name');
}
if (urlParams.get('monitors')) {
  document.getElementById('cfgMonitors').value = urlParams.get('monitors');
}

// 호스트 URL 자동 감지
const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
const autoHostUrl = `${wsProtocol}//${location.host}`;
document.getElementById('cfgHost').value = autoHostUrl;

// URL 파라미터에 auto=1이면 자동 연결
if (urlParams.get('auto') === '1') {
  setTimeout(() => connectToHost(), 500);
}

// ─── 호스트 연결 ────────────────────────────────────────
function connectToHost() {
  const name = document.getElementById('cfgName').value || '웹테스트';
  monitors = parseInt(document.getElementById('cfgMonitors').value) || 1;
  hostBaseUrl = location.origin;

  updateStatus('연결 중...', 'yellow');

  ws = new WebSocket(autoHostUrl);

  ws.onopen = () => {
    ws.send(JSON.stringify({
      type: 'register',
      clientId: clientId,
      name: name,
      monitors: monitors,
      scheduleVersion: 0
    }));
    updateStatus('호스트 연결됨 — 재생 대기 중', 'green');
  };

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    handleMessage(msg);
  };

  ws.onclose = () => {
    if (quitted) return; // 호스트 종료 명령이면 재연결하지 않음
    updateStatus('연결 끊김 — 재연결 시도 중...', 'red');
    setTimeout(() => connectToHost(), 5000);
  };

  ws.onerror = () => {
    updateStatus('연결 오류', 'red');
  };

  // 하트비트 (현재 재생 콘텐츠 보고 포함)
  setInterval(sendHeartbeat, 30000);
}

// 현재 재생 콘텐츠를 호스트 대시보드에 보고
let lastPlaying = null;
function sendHeartbeat() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({
      type: 'heartbeat',
      clientId: clientId,
      scheduleVersion: playlist.length > 0 ? Date.now() : 0,
      currentPlaying: lastPlaying
    }));
  }
}
function reportPlaying(entry, which) {
  if (!entry) { lastPlaying = null; sendHeartbeat(); return; }
  const left  = { url: entry.url,  filename: entry.filename,  mimeType: entry.mimeType };
  const right = { url: entry.url2, filename: entry.filename2, mimeType: entry.mimeType2 };
  const p = { monitors, layoutType: entry.layoutType };
  if (which === 'both') { p.screen1 = left; p.screen2 = right; }
  else if (which === 'right') { p.screen1 = right; p.screen2 = null; }
  else { p.screen1 = left; p.screen2 = null; }
  lastPlaying = p;
  sendHeartbeat();
}

// ─── 메시지 처리 ────────────────────────────────────────
function handleMessage(msg) {
  switch (msg.type) {
    case 'registered':
      clientId = msg.clientId;
      localStorage.setItem('web_client_id', clientId);
      break;

    case 'schedule_update':
      webStopped = false;
      if (msg.schedule && msg.schedule.entries && msg.schedule.entries.length > 0) {
        applySchedule(msg.schedule);
      }
      break;

    case 'play':
      playManual(msg.files);
      break;

    case 'stop':
      webStopped = true;
      stopPlayback();
      break;

    case 'quit':
      hostQuit();
      break;

    case 'sync_now':
      showInfo('🔄 동기화 명령 수신');
      break;

    // ─── 라이브 사진 (폰 촬영 → 즉시 송출) ────────────────
    case 'live_photo':
      if (webStopped) { showInfo('⏹ 멈춤 상태 — 라이브 사진 생략'); break; }
      applyLiveSettings(msg.settings);
      if (!msg.photo) break;
      placeInSlot(msg.photo);
      liveQueue.push(msg.photo);
      armLiveReturn();
      if (liveState === 'hero') shortenHero();
      else liveDrive();
      showInfo('📸 라이브 사진 수신' + (msg.photo.message ? ': ' + msg.photo.message : ''));
      break;

    case 'live_update':
      applyLiveSettings(msg.settings);
      if (msg.removedId) removeLivePhoto(msg.removedId);
      break;

    case 'live_clear':
      endLive();
      break;
  }
}

// 호스트 원격 종료: 재생 중지 + 연결 끊기 + 종료 화면
// (브라우저 탭은 스크립트로 강제로 닫을 수 없으므로 종료 안내 화면을 표시한다)
let quitted = false;
function hostQuit() {
  quitted = true;
  stopPlayback();
  reportPlaying(null);
  if (ws) { try { ws.close(); } catch (e) {} }
  const sb = document.getElementById('standby');
  sb.classList.remove('hidden');
  updateStatus('호스트에서 종료됨 — 이 탭은 닫아도 됩니다', 'red');
  const cfg = document.querySelector('.config-panel');
  if (cfg) cfg.innerHTML = '<div style="text-align:center; color:#e0a066; font-size:13px; line-height:1.7;">호스트에서 종료 명령을 받았습니다.<br>다시 재생하려면 이 탭을 새로고침(F5)하세요.</div>';
  try { window.close(); } catch (e) {} // 스크립트로 연 창이면 닫힘
}

// ─── 편성표 적용 ────────────────────────────────────────
function applySchedule(schedule) {
  playlist = schedule.entries;
  currentIndex = 0;
  showInfo(`📋 편성표 수신: ${playlist.length}개 항목`);
  startPlayback();
}

// ─── 재생 엔진 ──────────────────────────────────────────
function startPlayback() {
  if (playlist.length === 0) return;
  isPlaying = true;

  // UI 전환
  document.getElementById('standby').classList.add('hidden');
  const container = document.getElementById('playerContainer');
  container.classList.add('active');
  document.getElementById('fsBtn').style.display = 'block';

  if (monitors >= 2) {
    container.classList.remove('single');
    container.classList.add('dual');
    document.getElementById('screen2').style.display = 'flex';
  } else {
    container.classList.remove('dual');
    container.classList.add('single');
    document.getElementById('screen2').style.display = 'none';
  }

  playCurrentEntry();
}

function playCurrentEntry() {
  if (!isPlaying || playlist.length === 0) return;

  const entry = playlist[currentIndex % playlist.length];
  const duration = (entry.duration || 10) * 1000;
  const hasSecond = !!entry.url2;
  const wantBoth = monitors >= 2 || entry.layoutType === 'split';
  const container = document.getElementById('playerContainer');
  const screen2 = document.getElementById('screen2');

  const trans = entry.transition || 'fade';
  if (hasSecond && wantBoth) {
    // 좌/우 동시 표출 (듀얼 모니터 또는 분할)
    container.classList.add('dual'); container.classList.remove('single');
    screen2.style.display = 'flex';
    loadMedia('screen1', entry.url, entry.mimeType, trans, duration);
    loadMedia('screen2', entry.url2, entry.mimeType2, trans, duration);
    showInfo(`${currentIndex + 1}/${playlist.length}: ${entry.filename || ''} + ${entry.filename2 || ''}`);
    reportPlaying(entry, 'both');
    advanceAfter(entry, entry.mimeType, duration, nextEntry);
  } else if (hasSecond) {
    // 독립 + 단일 모니터: url1 → url2 순차
    container.classList.add('single'); container.classList.remove('dual');
    screen2.style.display = 'none';
    loadMedia('screen1', entry.url, entry.mimeType, trans, duration);
    showInfo(`${currentIndex + 1}/${playlist.length}: ${entry.filename || entry.url}`);
    reportPlaying(entry, 'left');
    advanceAfter(entry, entry.mimeType, duration, () => {
      loadMedia('screen1', entry.url2, entry.mimeType2, trans, duration);
      showInfo(`${currentIndex + 1}/${playlist.length}: ${entry.filename2 || entry.url2}`);
      reportPlaying(entry, 'right');
      advanceAfter(entry, entry.mimeType2, duration, nextEntry);
    });
  } else {
    container.classList.add('single'); container.classList.remove('dual');
    screen2.style.display = 'none';
    loadMedia('screen1', entry.url, entry.mimeType, trans, duration);
    showInfo(`${currentIndex + 1}/${playlist.length}: ${entry.filename || entry.url} (${entry.duration}초)`);
    reportPlaying(entry, 'left');
    advanceAfter(entry, entry.mimeType, duration, nextEntry);
  }
}

// 영상(원본 길이)이면 재생 종료 시, 아니면 duration 후 onDone 호출
function advanceAfter(entry, mimeType, duration, onDone) {
  clearTimeout(playTimer);
  const isVideo = mimeType && mimeType.startsWith('video');
  if (isVideo && entry.videoDuration !== 'custom') {
    const video = document.querySelector('#screen1 .layer:last-child video');
    if (video) { video.onended = () => onDone(); return; }
  }
  playTimer = setTimeout(() => onDone(), duration);
}

function nextEntry() {
  currentIndex = (currentIndex + 1) % playlist.length;
  playCurrentEntry();
}

// url은 절대(http) 또는 상대(/uploads/..). 상대면 호스트 프리픽스.
function loadMedia(screenId, url, mimeType, trans, durationMs) {
  const screen = document.getElementById(screenId);
  if (!url) { screen.innerHTML = ''; return; }
  trans = trans || 'fade';
  const src = /^https?:\/\//i.test(url) ? url : `${hostBaseUrl}${url.startsWith('/') ? '' : '/'}${url}`;

  const layer = document.createElement('div');
  layer.className = 'layer t-' + trans;
  if (trans === 'zoom') layer.style.setProperty('--kb', Math.max(6, (durationMs || 12000) / 1000) + 's');
  layer.innerHTML = (mimeType && mimeType.startsWith('video'))
    ? `<video src="${src}" autoplay muted playsinline></video>`
    : `<img src="${src}" alt="media">`;

  const old = screen.querySelector('.layer');
  screen.appendChild(layer);
  if (trans === 'cut') {
    layer.classList.add('active');
    if (old) old.remove();
  } else {
    requestAnimationFrame(() => requestAnimationFrame(() => layer.classList.add('active')));
    if (old) { old.classList.remove('active'); old.classList.add('leaving'); setTimeout(() => old.remove(), 800); }
  }
}

// ─── 수동 재생 (호스트에서 직접 명령) ───────────────────
function playManual(files) {
  // 편성표 재생 중단하고 수동 재생
  clearTimeout(playTimer);
  isPlaying = false;

  document.getElementById('standby').classList.add('hidden');
  const container = document.getElementById('playerContainer');
  container.classList.add('active');
  document.getElementById('fsBtn').style.display = 'block';

  if (files.length >= 2 && monitors >= 2) {
    container.classList.remove('single');
    container.classList.add('dual');
    document.getElementById('screen2').style.display = 'flex';
    loadMediaDirect('screen1', files[0]);
    loadMediaDirect('screen2', files[1]);
  } else {
    container.classList.remove('dual');
    container.classList.add('single');
    document.getElementById('screen2').style.display = 'none';
    loadMediaDirect('screen1', files[0]);
  }

  showInfo(`▶ 수동 재생: ${files[0].originalName}`);
}

function loadMediaDirect(screenId, file) {
  const screen = document.getElementById(screenId);
  const url = `${hostBaseUrl}${file.url}`;

  if (file.mimeType && file.mimeType.startsWith('video')) {
    screen.innerHTML = `<video src="${url}" autoplay muted playsinline loop style="width:100%;height:100%;object-fit:contain;"></video>`;
  } else {
    screen.innerHTML = `<img src="${url}" alt="${file.originalName}">`;
  }
}

function stopPlayback() {
  clearTimeout(playTimer);
  isPlaying = false;
  document.getElementById('playerContainer').classList.remove('active');
  document.getElementById('standby').classList.remove('hidden');
  document.getElementById('fsBtn').style.display = 'none';
  updateStatus('호스트 연결됨 — 재생 대기 중', 'green');
  showInfo('⏹ 정지');
  reportPlaying(null);
}

// ═══════════════════════════════════════════════════════
// 라이브 레이어 — 폰 촬영 사진
//   히어로(새 사진 풀스크린) → 그리드(최근 사진 1/2/3/4 적응 배치)
//   새 사진이 오면 다시 히어로. 무입력이 이어지면 코너로 축소된 뒤 소멸.
//   편성표 재생 루프는 이 레이어 아래에서 계속 돌고 있다.
//   (client/player.html 의 라이브 레이어와 같은 동작 — 두 플레이어는 독립 파일)
// ═══════════════════════════════════════════════════════
const LIVE_DEFAULTS = { heroMs: 8000, heroBusyMs: 4000, returnMs: 50000, cornerMs: 120000, gridMax: 4 };
const LIVE_HERO_MIN_MS = 1200;
const LIVE_RETURN_MIN_MS = 5000;

let webStopped = false;      // 호스트에서 '멈추기' 를 받은 상태
let liveSettings = Object.assign({}, LIVE_DEFAULTS);
let liveSlots = [];
let liveSlotCursor = 0;
let liveQueue = [];
let liveState = 'off';       // off | hero | grid | corner
let liveHeroTimer = null;
let liveHeroStartedAt = 0;
let liveHeroFullMs = 0;
let liveReturnTimer = null;
let liveCornerTimer = null;
let liveGoneTimer = null;

function liveEl(id) { return document.getElementById(id); }

function applyLiveSettings(s) {
  if (s) liveSettings = Object.assign({}, LIVE_DEFAULTS, s);
}

// 칸 배치: 최대 칸수까지는 칸을 늘리고, 가득 차면 가장 오래된 칸을 제자리 교체
function placeInSlot(photo) {
  const max = Math.max(1, Math.min(4, liveSettings.gridMax || 4));
  if (liveSlots.length < max) {
    liveSlots.push(photo);
    liveSlotCursor = liveSlots.length % max;
  } else {
    liveSlots[liveSlotCursor] = photo;
    liveSlotCursor = (liveSlotCursor + 1) % max;
  }
}

function removeLivePhoto(id) {
  liveQueue = liveQueue.filter(function (p) { return p.id !== id; });
  const idx = liveSlots.findIndex(function (p) { return p && p.id === id; });
  if (idx === -1) return;
  liveSlots.splice(idx, 1);
  if (liveSlotCursor > liveSlots.length) liveSlotCursor = liveSlots.length;
  if (!liveSlots.length) { endLive(); return; }
  if (liveState === 'hero' && liveEl('live-hero').dataset.photoId === id) {
    clearTimeout(liveHeroTimer);
    heroDone();
  } else if (liveState === 'grid' || liveState === 'corner') {
    renderLiveGrid(-1);
  }
}

function liveDrive() {
  if (!liveSlots.length) { endLive(); return; }
  // 3장 이상 한꺼번에 도착 — 히어로를 건너뛰고 바로 그리드로 (풀스크린 홍수 방지)
  if (liveQueue.length >= 3) {
    liveQueue.length = 0;
    showLiveGrid();
    return;
  }
  const next = liveQueue.shift();
  if (!next) { showLiveGrid(); return; }
  showLiveHero(next, liveQueue.length > 0 ? liveSettings.heroBusyMs : liveSettings.heroMs);
}

function liveOn() {
  clearTimeout(liveGoneTimer);
  const stage = liveEl('live-stage');
  stage.classList.remove('corner', 'gone');
  liveEl('live-layer').classList.add('on');
  if (liveCornerTimer) { clearTimeout(liveCornerTimer); liveCornerTimer = null; }
}

function livePhotoEl(photo, extraClass) {
  // hostBaseUrl 은 connectToHost() 에서 설정되지만, 그에 의존하지 않도록 origin 으로 폴백
  const base = hostBaseUrl || location.origin || '';
  const url = /^https?:\/\//i.test(photo.url) ? photo.url : base + photo.url;
  const box = document.createElement('div');
  box.className = 'lphoto' + (extraClass ? ' ' + extraClass : '');

  const bg = document.createElement('div');
  bg.className = 'lbg';
  // 세로 사진(폰 기본)이 가로 화면에서 좌우로 비지 않도록 같은 사진을 블러 배경으로 깐다
  bg.style.backgroundImage = 'url("' + url.replace(/"/g, '%22') + '")';
  box.appendChild(bg);

  const img = document.createElement('img');
  img.src = url;
  box.appendChild(img);

  if (photo.message) {
    const cap = document.createElement('div');
    cap.className = 'lcap';
    cap.textContent = photo.message;
    box.appendChild(cap);
  }
  return box;
}

function showLiveHero(photo, ms) {
  liveState = 'hero';
  liveOn();

  const hero = liveEl('live-hero');
  hero.innerHTML = '';
  hero.dataset.photoId = photo.id || '';
  hero.classList.remove('in', 'out');
  hero.appendChild(livePhotoEl(photo));

  // 셔터 플래시
  const flash = liveEl('live-flash');
  flash.classList.remove('fire');
  void flash.offsetWidth;
  flash.classList.add('fire');

  requestAnimationFrame(function () { requestAnimationFrame(function () { hero.classList.add('in'); }); });

  clearTimeout(liveHeroTimer);
  liveHeroFullMs = Math.max(LIVE_HERO_MIN_MS, ms || LIVE_DEFAULTS.heroMs);
  liveHeroStartedAt = Date.now();
  liveHeroTimer = setTimeout(heroDone, liveHeroFullMs);
}

// 히어로 중 새 사진이 도착하면 현재 히어로를 '대기 있을 때' 시간으로 줄인다
function shortenHero() {
  if (liveState !== 'hero') return;
  const busy = Math.max(LIVE_HERO_MIN_MS, liveSettings.heroBusyMs || LIVE_DEFAULTS.heroBusyMs);
  const elapsed = Date.now() - liveHeroStartedAt;
  const target = Math.max(600, busy - elapsed);
  if (target >= liveHeroFullMs - elapsed) return;
  clearTimeout(liveHeroTimer);
  liveHeroFullMs = elapsed + target;
  liveHeroTimer = setTimeout(heroDone, target);
}

function heroDone() {
  if (liveQueue.length) { liveDrive(); return; }
  showLiveGrid();
}

function showLiveGrid() {
  if (!liveSlots.length) { endLive(); return; }
  liveState = 'grid';
  liveOn();

  const newestIdx = liveSlots.length ? (liveSlotCursor - 1 + liveSlots.length) % liveSlots.length : -1;
  renderLiveGrid(newestIdx);

  const hero = liveEl('live-hero');
  hero.classList.remove('in');
  hero.classList.add('out');
  setTimeout(function () {
    if (liveState === 'hero') return;   // 그 사이 새 히어로가 떴으면 건드리지 않는다
    hero.innerHTML = '';
    hero.classList.remove('out');
    hero.dataset.photoId = '';
  }, 700);
}

function renderLiveGrid(popIndex) {
  const grid = liveEl('live-grid');
  grid.innerHTML = '';
  grid.dataset.n = String(liveSlots.length);
  liveSlots.forEach(function (photo, i) {
    if (!photo) return;
    grid.appendChild(livePhotoEl(photo, i === popIndex ? 'pop' : ''));
  });
  requestAnimationFrame(function () { grid.classList.add('in'); });
}

// 무입력 복귀 타이머 — 새 사진이 올 때마다 다시 센다
function armLiveReturn() {
  clearTimeout(liveReturnTimer);
  clearTimeout(liveCornerTimer);
  liveCornerTimer = null;
  liveEl('live-stage').classList.remove('corner');
  liveReturnTimer = setTimeout(toLiveCorner, Math.max(LIVE_RETURN_MIN_MS, liveSettings.returnMs || LIVE_DEFAULTS.returnMs));
}

// 편성표로 복귀 — 뚝 끊지 않고 코너에 잠시 축소되어 남는다
function toLiveCorner() {
  const cornerMs = liveSettings.cornerMs;
  if (!cornerMs || cornerMs <= 0) { endLive(); return; }
  if (liveState === 'hero') {
    clearTimeout(liveHeroTimer);
    showLiveGrid();
  }
  liveState = 'corner';
  liveEl('live-stage').classList.add('corner');
  liveCornerTimer = setTimeout(endLive, cornerMs);
}

function endLive() {
  clearTimeout(liveHeroTimer);
  clearTimeout(liveReturnTimer);
  clearTimeout(liveCornerTimer);
  liveHeroTimer = liveReturnTimer = liveCornerTimer = null;

  liveState = 'off';
  liveQueue = [];
  liveSlots = [];
  liveSlotCursor = 0;

  const stage = liveEl('live-stage');
  stage.classList.add('gone');
  clearTimeout(liveGoneTimer);
  liveGoneTimer = setTimeout(function () {
    liveEl('live-layer').classList.remove('on');
    stage.classList.remove('corner', 'gone');
    const grid = liveEl('live-grid');
    grid.innerHTML = '';
    grid.classList.remove('in');
    grid.removeAttribute('data-n');
    const hero = liveEl('live-hero');
    hero.innerHTML = '';
    hero.classList.remove('in', 'out');
    hero.dataset.photoId = '';
  }, 750);
}

// ─── UI 헬퍼 ────────────────────────────────────────────
function updateStatus(text, color) {
  const el = document.getElementById('statusText');
  el.innerHTML = `<span class="dot dot-${color}"></span> ${text}`;
}

function showInfo(text) {
  const el = document.getElementById('infoOverlay');
  el.textContent = text;
  el.classList.add('visible');
  setTimeout(() => el.classList.remove('visible'), 3000);
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
}

// 키보드 단축키
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.fullscreenElement) document.exitFullscreen();
  }
  if (e.key === 'f' || e.key === 'F') toggleFullscreen();
  if (e.key === 'i' || e.key === 'I') {
    const el = document.getElementById('infoOverlay');
    el.classList.toggle('visible');
  }
});

// 마우스 움직임으로 오버레이 표시
let mouseTimer;
document.addEventListener('mousemove', () => {
  document.getElementById('fsBtn').style.opacity = '1';
  clearTimeout(mouseTimer);
  mouseTimer = setTimeout(() => {
    document.getElementById('fsBtn').style.opacity = '0';
  }, 3000);
});
</script>
