<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>사진 올리기 — 디지털 게시판</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #111318;
  --card: #1c1f27;
  --card2: #23262f;
  --line: rgba(255,255,255,0.10);
  --text: #f2f4f8;
  --dim: #9aa2b1;
  --accent: #4c8dff;
  --ok: #2ecc71;
  --danger: #e74c3c;
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
  min-height: 100vh;
  padding: max(16px, env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 520px; margin: 0 auto; }

header { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
header .logo { font-size: 26px; }
header h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.2px; }
header .sub { font-size: 12px; color: var(--dim); margin-top: 2px; }

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 14px;
}
.label { font-size: 12px; color: var(--dim); margin-bottom: 8px; display: block; font-weight: 600; }

/* 대상 모니터 칩 */
#targetChip {
  width: 100%;
  display: flex; align-items: center; gap: 10px;
  background: var(--card2);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px 16px;
  color: var(--text);
  font-size: 17px; font-weight: 700;
  text-align: left;
  cursor: pointer;
}
#targetChip .ic { font-size: 22px; }
#targetChip .nm { flex: 1; }
#targetChip .arrow { color: var(--dim); font-size: 13px; font-weight: 400; }
#targetChip.unset { border-color: rgba(231,76,60,0.5); }
#targetChip .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; flex: none; }
#targetChip .dot.on { background: var(--ok); box-shadow: 0 0 8px rgba(46,204,113,0.7); }
.hint { font-size: 11px; color: var(--dim); margin-top: 8px; line-height: 1.5; }

/* 사이트 선택 목록 */
#siteList { display: none; margin-top: 10px; }
#siteList.show { display: block; }
.site-opt {
  display: flex; align-items: center; gap: 10px;
  padding: 13px 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  margin-bottom: 8px;
  background: var(--card2);
  cursor: pointer;
  font-size: 15px;
}
.site-opt.sel { border-color: var(--accent); background: rgba(76,141,255,0.12); }
.site-opt .ic { font-size: 20px; }
.site-opt .nm { flex: 1; font-weight: 600; }
.site-opt .st { font-size: 11px; color: var(--dim); }
.site-opt .st.on { color: var(--ok); }

/* 메시지 입력 */
#msg {
  width: 100%;
  background: var(--card2);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px;
  color: var(--text);
  font-size: 16px;
  font-family: inherit;
}
#msg:focus { outline: none; border-color: var(--accent); }
#msg::placeholder { color: #6b7280; }
.counter { text-align: right; font-size: 11px; color: var(--dim); margin-top: 6px; }

/* 촬영 버튼 */
.big-btn {
  width: 100%;
  border: none; border-radius: 18px;
  padding: 22px;
  font-size: 19px; font-weight: 800;
  color: #fff;
  background: linear-gradient(135deg, #4c8dff, #2f6fe0);
  box-shadow: 0 10px 26px rgba(47,111,224,0.35);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  font-family: inherit;
}
.big-btn:disabled { opacity: 0.45; box-shadow: none; }
/* 막힌 상태 — 비활성(disabled)이 아니라 "이유가 적힌 누를 수 있는 버튼".
   눌러서 서버 상태를 다시 확인할 수 있어야 한다. */
.big-btn.blocked {
  background: var(--card2);
  border: 1px solid rgba(255,255,255,0.14);
  box-shadow: none;
  color: var(--dim);
  font-size: 15px;
  font-weight: 600;
  line-height: 1.45;
  flex-direction: column;
  gap: 4px;
}
.big-btn.blocked .tap { font-size: 12px; color: #6b7280; font-weight: 400; }
.big-btn.sub {
  background: var(--card2);
  border: 1px solid var(--line);
  box-shadow: none;
  font-size: 15px; font-weight: 600; padding: 15px;
}
.big-btn.danger { background: var(--danger); box-shadow: none; font-size: 15px; padding: 14px; }
#fileInput { display: none; }

/* 미리보기 */
#preview { display: none; margin-bottom: 14px; }
#preview.show { display: block; }
#preview img {
  width: 100%;
  max-height: 46vh;
  object-fit: contain;
  border-radius: 14px;
  background: #000;
  display: block;
}

/* 상태 표시 */
#status { display: none; text-align: center; padding: 18px 16px; }
#status.show { display: block; }
#status .big { font-size: 34px; margin-bottom: 8px; }
#status .t { font-size: 16px; font-weight: 700; }
#status .d { font-size: 12px; color: var(--dim); margin-top: 6px; line-height: 1.5; }
#status.ok .t { color: var(--ok); }
#status.err .t { color: var(--danger); }

.banner {
  border-radius: 12px; padding: 13px 14px; font-size: 13px; line-height: 1.5;
  margin-bottom: 14px; display: none;
}
.banner.show { display: block; }
.banner.warn { background: rgba(230,126,34,0.15); border: 1px solid rgba(230,126,34,0.4); color: #ffd9a8; }
.banner.err  { background: rgba(231,76,60,0.15); border: 1px solid rgba(231,76,60,0.4); color: #ffb8b0; }
.banner.ok   { background: rgba(46,204,113,0.15); border: 1px solid rgba(46,204,113,0.4); color: #b6f0cd; }

.spin {
  width: 30px; height: 30px; margin: 0 auto 10px;
  border: 3px solid rgba(255,255,255,0.15);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

footer { text-align: center; font-size: 11px; color: #5b6270; margin-top: 20px; line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">📸</div>
    <div>
      <h1>사진 올리기</h1>
      <div class="sub" id="whoami">— </div>
    </div>
  </header>

  <div class="banner" id="banner"></div>

  <!-- 대상 모니터 (바꿀 때까지 유지됨) -->
  <div class="card">
    <span class="label">송출할 모니터</span>
    <button id="targetChip" class="unset" onclick="toggleSiteList()">
      <span class="dot"></span>
      <span class="ic">📺</span>
      <span class="nm">선택해 주세요</span>
      <span class="arrow">바꾸기 ▾</span>
    </button>
    <div id="siteList"></div>
    <div class="hint">한 번 고르면 <b>바꿀 때까지 그대로 유지</b>됩니다. 이 폰에만 저장됩니다.</div>
  </div>

  <!-- 촬영 / 업로드 -->
  <div id="composer">
    <div class="card" id="preview">
      <img id="previewImg" alt="미리보기">
    </div>

    <div class="card">
      <span class="label">화면에 함께 띄울 메시지 (선택)</span>
      <input id="msg" type="text" maxlength="40" placeholder="예: 김집사님 생일 축하합니다" autocomplete="off">
      <div class="counter"><span id="msgCount">0</span>/40</div>
      <div class="hint">비워두면 사진만 나갑니다. 링크·주소는 넣을 수 없습니다.</div>
    </div>

    <input type="file" id="fileInput" accept="image/*" capture="environment">
    <button class="big-btn" id="shootBtn" onclick="pickPhoto()">📷 촬영하고 바로 올리기</button>
    <button class="big-btn sub" id="galleryBtn" style="margin-top:10px" onclick="pickFromGallery()">🖼 앨범에서 고르기 (여러 장 가능)</button>
    <input type="file" id="galleryInput" accept="image/*" multiple style="display:none">
  </div>

  <!-- 업로드 상태 -->
  <div class="card" id="status">
    <div id="statusBody"></div>
  </div>

  <footer>
    브라우저 메뉴 → <b>홈 화면에 추가</b> 하면 앱처럼 쓸 수 있습니다.<br>
    <span id="verLine">디지털 게시판 라이브</span>
    <br><a href="/privacy" target="_blank" rel="noopener" style="color:inherit">개인정보 처리 안내</a> · <a href="/terms" target="_blank" rel="noopener" style="color:inherit">이용약관</a>
  </footer>

</div>

<script>
// ═══════════════════════════════════════════════════════════
// 상태 — 토큰 / 업로더 / 대상 모니터는 모두 이 폰에 저장(유지)
// ═══════════════════════════════════════════════════════════
const LS = {
  token: 'live.token',
  siteId: 'live.siteId',
  siteName: 'live.siteName',
  siteIcon: 'live.siteIcon',
  uploaderId: 'live.uploaderId',
  uploaderName: 'live.uploaderName',
  pending: 'live.pending',   // 카메라 진입 후 아직 사진을 받지 못한 상태
  draft: 'live.draft'        // 입력 중이던 메시지 (탭이 폐기돼도 살리기 위해)
};

function ls(k, v) {
  try {
    if (v === undefined) return localStorage.getItem(k);
    if (v === null) { localStorage.removeItem(k); return null; }
    localStorage.setItem(k, v); return v;
  } catch (e) { return null; }
}

// 토큰: URL의 ?t= 가 있으면 그것을 저장(= 새 링크로 갱신), 없으면 저장된 것 사용
const urlToken = new URLSearchParams(location.search).get('t');
if (urlToken) ls(LS.token, urlToken);
let token = ls(LS.token) || '';

// 업로더 식별자 — 화면에는 표시하지 않고 서버 로그에만 남는다(책임 추적)
let uploaderId = ls(LS.uploaderId);
if (!uploaderId) {
  uploaderId = 'u_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  ls(LS.uploaderId, uploaderId);
}
let uploaderName = ls(LS.uploaderName) || '';

let sites = [];
let liveEnabled = false;
let cancelSec = 60;
let busy = false;
const MAX_BATCH = 12;   // 한 번에 보낼 수 있는 최대 장수
// 막힌 이유 ({ label, detail }) 또는 null. 막혀도 버튼은 누를 수 있고,
// 누르면 서버 상태를 다시 확인한다.
let block = null;
let recheckTimer = null;

const el = id => document.getElementById(id);

// 버튼 표시 갱신 — 업로드 중(busy)에만 실제 disabled, 막힌 상태는 이유를 적어 보여준다
function applyButtons() {
  const shoot = el('shootBtn');
  const gal = el('galleryBtn');
  shoot.disabled = busy;
  gal.disabled = busy;   // 막힌 상태에서도 눌러서 재확인할 수 있어야 한다
  shoot.classList.toggle('blocked', !!block);
  gal.classList.toggle('blocked', !!block);
  if (block) {
    shoot.innerHTML = '🚫 ' + escapeHtml(block.label) + '<span class="tap">눌러서 다시 확인</span>';
    gal.textContent = '🖼 앨범에서 고르기';
  } else {
    shoot.innerHTML = '📷 촬영하고 바로 올리기';
    gal.textContent = '🖼 앨범에서 고르기';
  }
}

function setBlock(info) {
  block = info || null;
  applyButtons();
  if (block && block.detail) showBanner(block.kind || 'warn', block.detail);
  else hideBanner();
  // 막힌 동안에는 주기적으로 다시 확인 — 관리자가 스위치를 켜면 저절로 풀린다
  if (block && token) startRecheck();
  else stopRecheck();
}

function startRecheck() {
  if (recheckTimer) return;
  recheckTimer = setInterval(() => { init(true); }, 15000);
}
function stopRecheck() {
  if (recheckTimer) { clearInterval(recheckTimer); recheckTimer = null; }
}

// ═══════════════════════════════════════════════════════════
// 초기 로드
// ═══════════════════════════════════════════════════════════
// quiet=true 면 자동 재확인(주기 폴링) — 이름 묻기 같은 방해 동작을 하지 않는다
async function init(quiet) {
  if (!token) {
    setBlock({
      label: '링크가 필요합니다',
      kind: 'err',
      detail: '이 페이지는 관리자가 준 링크로 열어야 합니다. (링크에 <b>?t=</b> 부분이 필요합니다)'
    });
    return;
  }

  if (!uploaderName && !quiet) askName(true);
  renderWhoami();
  if (!quiet) recoverFromLostShot();

  try {
    const res = await fetch(`/live/api/hello?t=${encodeURIComponent(token)}`);
    const data = await res.json();
    if (!res.ok) {
      setBlock({
        label: '링크를 다시 받아주세요',
        kind: 'err',
        detail: data.error || '링크가 유효하지 않습니다.'
      });
      return;
    }
    sites = data.sites || [];
    liveEnabled = !!data.enabled;
    cancelSec = data.cancelSec || 60;

    if (!liveEnabled) {
      setBlock({
        label: '지금은 송출이 꺼져 있습니다',
        kind: 'warn',
        detail: '관리자가 <b>라이브 송출</b>을 켜면 바로 올릴 수 있습니다. 켜지는지 자동으로 확인하고 있습니다.'
      });
    } else if (!sites.length) {
      setBlock({
        label: '등록된 모니터가 없습니다',
        kind: 'warn',
        detail: '보낼 수 있는 모니터가 없습니다. 관리자에게 문의해 주세요.'
      });
    } else {
      setBlock(null);
    }

    restoreTarget();
    renderSiteList();
  } catch (e) {
    setBlock({
      label: '서버에 연결할 수 없습니다',
      kind: 'err',
      detail: '인터넷 연결을 확인해 주세요. 자동으로 다시 시도합니다.'
    });
  }
}

// 카메라를 열었는데 사진이 돌아오지 않은 흔적이 남아 있으면 알려준다.
// (폰이 카메라를 쓰는 동안 메모리 부족으로 이 페이지를 폐기하면, 돌아왔을 때
//  페이지가 새로 로드되어 change 이벤트가 아예 오지 않는다 — 가장 흔한 조용한 실패)
function recoverFromLostShot() {
  const pending = ls(LS.pending);
  const draft = ls(LS.draft);

  // 쓰던 메시지는 무조건 되살린다
  if (draft && !el('msg').value) {
    el('msg').value = draft;
    el('msgCount').textContent = draft.length;
  }

  if (!pending) return;
  ls(LS.pending, null);
  const ago = Date.now() - Number(pending);
  if (!(ago >= 0 && ago < 10 * 60 * 1000)) return;   // 오래된 흔적은 무시

  showBanner('warn',
    '직전에 찍은 사진이 <b>전달되지 않았습니다.</b> 폰이 카메라를 쓰는 동안 이 화면을 ' +
    '잠시 닫았을 수 있습니다(메모리 부족). 다시 찍어 주세요 — 메시지는 그대로 남겨두었습니다.' +
    (draft ? '' : ' 계속 실패하면 <b>앨범에서 고르기</b>로 올려보세요.'));
}

// 카메라에서 돌아왔는데(화면이 다시 보이는데) 사진이 오지 않으면 알려준다.
// 촬영을 취소한 경우도 여기로 오므로 문구는 두 경우에 모두 맞게 쓴다.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (!ls(LS.pending)) return;
  setTimeout(() => {
    if (fileArrived || !ls(LS.pending) || busy) return;
    ls(LS.pending, null);
    showBanner('warn', '사진을 받지 못했습니다. 촬영을 취소했거나 전달이 실패했을 수 있습니다 — 다시 시도해 주세요.');
  }, 2500);
});

function renderWhoami() {
  el('whoami').innerHTML = uploaderName
    ? `${escapeHtml(uploaderName)} · <a href="#" onclick="askName();return false" style="color:#6b7280">이름 변경</a>`
    : `<a href="#" onclick="askName();return false" style="color:#6b7280">이름 등록</a>`;
}

function askName(firstTime) {
  const v = prompt(firstTime
    ? '이름을 한 번만 등록해 주세요.\n(화면에는 나오지 않고, 관리 기록에만 남습니다)'
    : '이름을 입력해 주세요.', uploaderName || '');
  if (v === null) return;
  uploaderName = v.trim().slice(0, 20);
  ls(LS.uploaderName, uploaderName);
  renderWhoami();
}

// ═══════════════════════════════════════════════════════════
// 대상 모니터 — 선택은 바꿀 때까지 유지
// ═══════════════════════════════════════════════════════════
function currentTarget() {
  const id = ls(LS.siteId);
  if (!id) return null;
  const live = sites.find(s => s.id === id);
  if (live) return live;
  // 서버에서 사라진 사이트면 선택 해제
  return { id, name: ls(LS.siteName) || id, icon: ls(LS.siteIcon) || '📺', online: false, missing: true };
}

function restoreTarget() {
  const t = currentTarget();
  const chip = el('targetChip');
  if (!t) {
    chip.classList.add('unset');
    chip.querySelector('.nm').textContent = '선택해 주세요';
    chip.querySelector('.ic').textContent = '📺';
    chip.querySelector('.dot').classList.remove('on');
    if (sites.length) el('siteList').classList.add('show'); // 처음이면 목록을 펼쳐 보여준다
    return;
  }
  chip.classList.remove('unset');
  chip.querySelector('.nm').textContent = t.name;
  chip.querySelector('.ic').textContent = t.icon || '📺';
  chip.querySelector('.dot').classList.toggle('on', !!t.online);
  if (t.missing) {
    showBanner('warn', `저장된 모니터 <b>${escapeHtml(t.name)}</b> 를 찾을 수 없습니다. 다시 선택해 주세요.`);
    el('siteList').classList.add('show');
  }
}

function toggleSiteList() {
  el('siteList').classList.toggle('show');
}

function renderSiteList() {
  const cur = ls(LS.siteId);
  el('siteList').innerHTML = sites.map(s => `
    <div class="site-opt ${s.id === cur ? 'sel' : ''}" onclick="selectSite('${s.id}')">
      <span class="ic">${s.icon || '📺'}</span>
      <span class="nm">${escapeHtml(s.name)}</span>
      <span class="st ${s.online ? 'on' : ''}">${s.online ? '● 켜짐' : '○ 꺼짐'}</span>
    </div>
  `).join('') || '<div class="hint">등록된 모니터가 없습니다.</div>';
}

function selectSite(id) {
  const s = sites.find(x => x.id === id);
  if (!s) return;
  ls(LS.siteId, s.id);
  ls(LS.siteName, s.name);
  ls(LS.siteIcon, s.icon || '📺');
  hideBanner();
  restoreTarget();
  renderSiteList();
  el('siteList').classList.remove('show');
}

// ═══════════════════════════════════════════════════════════
// 촬영 → 리사이즈 → 업로드
// ═══════════════════════════════════════════════════════════
async function pickPhoto() {
  // 막힌 상태에서 누르면: 서버 상태를 다시 확인한다.
  // 이때 카메라를 바로 열지는 않는다 — await 로 사용자 제스처가 끊기면
  // iOS 가 file input 열기를 조용히 무시하기 때문이다(다시 누르도록 안내).
  if (block) {
    const prev = block.label;
    el('shootBtn').innerHTML = '확인 중...';
    await init(true);
    if (block) {
      if (block.label === prev) showBanner(block.kind || 'warn', block.detail + ' <b>(방금 확인함)</b>');
    } else {
      showBanner('ok', '준비됐습니다. <b>촬영 버튼을 한 번 더 눌러</b> 주세요.');
    }
    return;
  }
  if (!ls(LS.siteId)) {
    alert('먼저 송출할 모니터를 선택해 주세요.');
    el('siteList').classList.add('show');
    return;
  }
  openPicker('fileInput');
}

function pickFromGallery() {
  if (block) return pickPhoto();
  if (!ls(LS.siteId)) {
    alert('먼저 송출할 모니터를 선택해 주세요.');
    el('siteList').classList.add('show');
    return;
  }
  openPicker('galleryInput');
}

// 카메라/앨범을 열기 직전에 '진행 중' 흔적을 남긴다.
// 폰이 카메라를 쓰는 동안 메모리 부족으로 이 페이지를 폐기하는 일이 있는데,
// 그러면 돌아왔을 때 change 이벤트가 아예 오지 않아 아무 일도 없는 것처럼 보인다.
// 다음 로드에서 이 흔적을 보고 원인을 알려주고, 쓰던 메시지도 되살린다.
function openPicker(inputId) {
  ls(LS.pending, String(Date.now()));
  ls(LS.draft, el('msg').value || '');
  fileArrived = false;
  const input = el(inputId);
  input.value = '';
  input.click();
}

el('fileInput').addEventListener('change', e => onPicked(e.target.files));
el('galleryInput').addEventListener('change', e => onPicked(e.target.files));

el('msg').addEventListener('input', e => {
  el('msgCount').textContent = e.target.value.length;
  ls(LS.draft, e.target.value);   // 탭이 폐기돼도 메시지가 남도록 저장
});

// 사진이 돌아왔을 때의 입구 — 여기서 조용히 끝나는 경우가 없도록 한다.
// 앨범에서 여러 장을 고르면 고른 순서대로 하나씩 올린다.
let fileArrived = false;
function onPicked(files) {
  fileArrived = true;
  ls(LS.pending, null);

  const list = Array.from(files || []);
  if (!list.length) {
    // 카메라/앨범이 결과를 돌려주지 못한 경우 (일부 안드로이드에서 발생)
    showStatus('err', '<div class="big">⚠️</div><div class="t">사진을 받지 못했습니다</div>' +
      '<div class="d">카메라가 사진을 넘겨주지 못했습니다. 다시 시도하거나 <b>앨범에서 고르기</b>를 이용해 주세요.</div>' +
      '<button class="big-btn sub" style="margin-top:14px" onclick="resetComposer()">돌아가기</button>');
    return;
  }

  const valid = list.filter(f => f && f.size > 0);
  if (!valid.length) {
    showStatus('err', '<div class="big">⚠️</div><div class="t">사진 파일이 비어 있습니다</div>' +
      '<div class="d">저장이 끝나기 전에 넘어온 것 같습니다. 다시 찍어 주세요.</div>' +
      '<button class="big-btn sub" style="margin-top:14px" onclick="resetComposer()">돌아가기</button>');
    return;
  }

  handleFiles(valid, list.length - valid.length);
}

// 한 장만 넘어오는 경우도 같은 경로를 쓴다 (호출부 호환)
function handleFile(file) {
  return onPicked(file ? [file] : []);
}

async function handleFiles(files, skipped) {
  if (busy) {
    // 이전 업로드가 아직 진행 중 — 조용히 무시하지 않고 알려준다
    showBanner('warn', '앞서 올린 사진을 <b>아직 보내는 중</b>입니다. 잠시만 기다려 주세요.');
    return;
  }
  if (!ls(LS.siteId)) {
    alert('먼저 송출할 모니터를 선택해 주세요.');
    el('siteList').classList.add('show');
    return;
  }

  const total = Math.min(files.length, MAX_BATCH);
  const overflow = files.length - total;
  const message = el('msg').value.trim();
  const siteName = ls(LS.siteName) || '';
  const done = [];      // 올린 사진 { id }
  const failed = [];    // 실패 사유
  let screensSeen = 0;

  setBusy(true);
  try {
    for (let i = 0; i < total; i++) {
      const nth = total > 1 ? `<div class="d">${i + 1} / ${total} 장</div>` : '';
      showStatus('', `<div class="spin"></div><div class="t">사진 준비 중...</div>${nth}`);

      let blob;
      try {
        blob = await resizeImage(files[i], 3840, 0.90);
      } catch (e) {
        failed.push((files[i].name || (i + 1) + '번째') + ': 읽을 수 없는 사진');
        continue;
      }

      // 미리보기 — 지금 보내는 사진을 보여준다
      try {
        el('previewImg').src = URL.createObjectURL(blob);
        el('preview').classList.add('show');
      } catch (e) {}

      showStatus('', `<div class="spin"></div><div class="t">${escapeHtml(siteName)} 화면으로 보내는 중...</div>
        <div class="d">${total > 1 ? (i + 1) + ' / ' + total + ' 장 · ' : ''}${(blob.size / 1024).toFixed(0)} KB</div>`);

      try {
        const fd = new FormData();
        fd.append('t', token);
        fd.append('siteId', ls(LS.siteId));
        fd.append('message', message);
        fd.append('uploaderId', uploaderId);
        fd.append('uploaderName', uploaderName);
        fd.append('batchTotal', String(total));   // 의도적으로 고른 묶음임을 화면에 알린다
        fd.append('photo', blob, 'photo.jpg');

        const res = await fetch('/live/api/photo', { method: 'POST', body: fd });
        const data = await res.json();
        if (!res.ok) { failed.push(data.error || '업로드 실패'); continue; }
        done.push(data.photo);
        screensSeen = Math.max(screensSeen, data.screens || 0);
      } catch (e) {
        failed.push('전송 실패 — 인터넷 연결을 확인해 주세요');
      }
    }
  } finally {
    setBusy(false);
  }

  if (done.length) {
    el('msg').value = '';
    el('msgCount').textContent = '0';
    ls(LS.draft, null);
  }
  ls(LS.pending, null);

  showUploadResult({ done, failed, total, overflow, skipped, screens: screensSeen, siteName });
}

function showUploadResult(r) {
  const n = r.done.length;

  if (!n) {
    showStatus('err', `<div class="big">⚠️</div><div class="t">올리지 못했습니다</div>
      <div class="d">${escapeHtml(r.failed[0] || '알 수 없는 오류')}</div>
      <button class="big-btn sub" style="margin-top:14px" onclick="resetComposer()">다시 시도</button>`);
    return;
  }

  const where = escapeHtml(r.siteName || '');
  const detail = `${where} · 서버에 저장했습니다. 모니터 표시 여부를 확인하고 있습니다.`;

  const notes = [];
  if (r.failed.length) notes.push(`${r.failed.length}장은 올리지 못했습니다 (${escapeHtml(r.failed[0])})`);
  if (r.skipped) notes.push(`${r.skipped}장은 빈 파일이라 건너뜀`);
  if (r.overflow) notes.push(`한 번에 ${MAX_BATCH}장까지만 보냅니다 — ${r.overflow}장은 보내지 않음`);

  showStatus('ok', `
    <div class="big">✅</div>
    <div class="t">${n > 1 ? n + '장 저장했어요!' : '사진을 저장했어요!'}</div>
    <div class="d"><span id="deliveryStatus">${detail}</span><br>${n > 1
      ? '고른 순서대로 한 장씩 크게 보인 뒤 함께 배치됩니다.'
      : '잠시 크게 보인 뒤 다른 사진들과 함께 배치됩니다.'}
      ${notes.length ? '<br><span style="color:#e0a066">' + notes.join(' · ') + '</span>' : ''}</div>
    <button class="big-btn" style="margin-top:16px" onclick="resetComposer()">📷 더 올리기</button>
    <button class="big-btn danger" style="margin-top:10px" id="cancelBtn">${n > 1 ? n + '장 모두 ' : ''}취소하기 (<span id="cdown">${cancelSec}</span>초)</button>
  `);

  watchDelivery(r.done.map(p => p.id));
  const btn = el('cancelBtn');
  let left = cancelSec;
  const timer = setInterval(() => {
    left--;
    const cd = el('cdown');
    if (cd) cd.textContent = left;
    if (left <= 0) { clearInterval(timer); if (btn) btn.remove(); }
  }, 1000);

  btn.onclick = async () => {
    clearInterval(timer);
    btn.disabled = true;
    btn.textContent = '취소 중...';
    let removed = 0, lastErr = '';
    for (const p of r.done) {
      try {
        const res = await fetch(`/live/api/photo/${p.id}?t=${encodeURIComponent(token)}&uploaderId=${encodeURIComponent(uploaderId)}`, { method: 'DELETE' });
        const j = await res.json();
        if (res.ok) removed++; else lastErr = j.error || '취소할 수 없습니다';
      } catch (e) { lastErr = '취소 실패 — 관리자에게 문의'; }
    }
    if (removed) {
      showStatus('', `<div class="big">🗑</div><div class="t">${removed > 1 ? removed + '장을 ' : ''}화면에서 내렸습니다</div>
        ${removed < r.done.length ? `<div class="d">${r.done.length - removed}장은 내리지 못했습니다 (${escapeHtml(lastErr)})</div>` : ''}
        <button class="big-btn" style="margin-top:16px" onclick="resetComposer()">📷 다시 올리기</button>`);
    } else {
      btn.textContent = lastErr || '취소할 수 없습니다';
    }
  };
}

async function watchDelivery(ids) {
  const label = el('deliveryStatus');
  if (!label) return;
  const end = Date.now() + 45000;
  while (label.isConnected && Date.now() < end) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 5000);
    try {
      const res = await fetch(`/live/api/delivery?t=${encodeURIComponent(token)}&ids=${encodeURIComponent(ids.join(','))}`,
        { signal: controller.signal, cache: 'no-store' });
      if (!res.ok) throw new Error('status unavailable');
      const data = await res.json();
      if (!label.isConnected) return;
      const photos = data.photos || [];
      const displayed = photos.filter(p => p.displayed > 0).length;
      if (displayed === ids.length) {
        label.textContent = `${displayed}장 · 모니터 플레이어에서 이미지 표시를 확인했습니다.`;
        return;
      }
      if (photos.some(p => p.errors.includes('stopped'))) {
        label.textContent = '서버 저장 완료 · 모니터가 멈춤 상태입니다. 모니터에서 재생을 시작해 주세요.';
      } else if (photos.some(p => p.errors.includes('image_error'))) {
        label.textContent = '서버 저장 완료 · 모니터가 사진을 불러오지 못했습니다. 재전송을 시도하고 있습니다.';
      } else if (photos.length && photos.every(p => p.online === 0)) {
        label.textContent = '서버 저장 완료 · 연결된 모니터가 없습니다. 연결이 복구되면 라이브 시간 안에서 다시 보냅니다.';
      } else {
        label.textContent = `서버 저장 완료 · ${displayed}/${ids.length}장 표시 확인. 나머지 사진의 표시 응답을 기다립니다.`;
      }
    } catch (e) {
      if (label.isConnected) label.textContent = '서버 저장 완료 · 모니터 표시 상태를 조회하지 못했습니다.';
    } finally { clearTimeout(timer); }
    await new Promise(resolve => setTimeout(resolve, 2000));
  }
  if (label.isConnected) label.textContent += ' 표시가 확인되지 않으면 모니터 연결과 설치형 프로그램 업데이트를 확인해 주세요.';
}

// busy 는 잠깁니다 — 어떤 이유로든 해제되지 않으면 이후 모든 촬영이 조용히 무시되므로
// 안전 타임아웃을 둔다.
let busyTimer = null;
function setBusy(on) {
  busy = !!on;
  applyButtons();
  clearTimeout(busyTimer);
  if (busy) {
    busyTimer = setTimeout(() => {
      if (!busy) return;
      busy = false;
      applyButtons();
      showBanner('warn', '업로드가 응답하지 않아 중단했습니다. 다시 시도해 주세요.');
    }, 90000);
  }
}

function resetComposer() {
  el('status').classList.remove('show', 'ok', 'err');
  el('preview').classList.remove('show');
  el('previewImg').removeAttribute('src');
  el('composer').style.display = '';
  setBusy(false);
  init(true); // 사이트 온라인 상태 및 송출 ON/OFF 갱신
}

function showStatus(kind, html) {
  const s = el('status');
  s.className = 'card show' + (kind ? ' ' + kind : '');
  el('statusBody').innerHTML = html;
  el('composer').style.display = 'none';
}

function showBanner(kind, html) {
  const b = el('banner');
  b.className = 'banner show ' + kind;
  b.innerHTML = html;
}
function hideBanner() { el('banner').className = 'banner'; }

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ═══════════════════════════════════════════════════════════
// 이미지 리사이즈 — 폰에서 줄여 보내야 "찍자마자 뜬다"가 성립한다.
// EXIF 회전은 createImageBitmap의 imageOrientation:'from-image' 또는
// <img> 디코딩(모던 모바일 브라우저 기본 적용)으로 처리된다.
// ═══════════════════════════════════════════════════════════
async function resizeImage(file, maxEdge, quality) {
  const src = await decodeImage(file);
  const w0 = src.width, h0 = src.height;
  const scale = Math.min(1, maxEdge / Math.max(w0, h0));
  const w = Math.max(1, Math.round(w0 * scale));
  const h = Math.max(1, Math.round(h0 * scale));

  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(src, 0, 0, w, h);
  if (src.close) src.close();

  const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
  if (!blob) throw new Error('이미지 변환 실패');
  // 전송 파일명은 photo.jpg다. 작은 HEIC 원본을 되돌리면 폰에서는 읽혀도
  // 설치형 Chromium 플레이어에서는 디코딩되지 않을 수 있으므로 JPEG를 유지한다.
  return blob;
}

async function decodeImage(file) {
  if (window.createImageBitmap) {
    try {
      return await createImageBitmap(file, { imageOrientation: 'from-image' });
    } catch (e) { /* 구형 브라우저 폴백 */ }
  }
  return await new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('사진을 읽을 수 없습니다')); };
    img.src = url;
  });
}

init();
</script>
