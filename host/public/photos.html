<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>사진 보관함 · 예봄 사이니지</title>
<style>
[hidden]{display:none!important}
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#202b3b;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}header{background:#192638;color:white;padding:22px max(24px,calc((100vw - 1240px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:24px;margin:0 0 6px}header p{color:#c4d0df;margin:0;font-size:13px}a{color:inherit}header a{text-decoration:none;white-space:nowrap;font-size:14px}main{max-width:1288px;margin:auto;padding:26px 24px}.connection{border:1px solid #dce3ed;background:#fff;border-radius:12px;padding:18px 20px;display:flex;gap:16px;justify-content:space-between;align-items:center}.connection.warn{border-color:#ebc77d;background:#fffaf0}.connection strong{display:block;margin-bottom:6px}.connection p{margin:0;line-height:1.6;font-size:13px;color:#596579}.connection a{font-size:13px}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:26px 0 18px}button,.button,input{font:inherit;border:1px solid #d5dce6;background:#fff;border-radius:7px;padding:9px 13px;color:#24354e}.button{text-decoration:none;display:inline-block;text-align:center}button,.button{cursor:pointer;font-size:13px;font-weight:600}button:hover,.button:hover{background:#edf2f8}button:disabled{opacity:.55;cursor:default}.primary{background:#285ab1;color:#fff;border-color:#285ab1}.primary:hover{background:#214e9b}.toolbar label{font-size:13px}.toolbar .count{margin-left:auto;color:#68778b;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}.card{background:#fff;border:1px solid #e0e5ed;border-radius:12px;overflow:hidden}.preview{height:210px;background:#e9edf3;display:block;width:100%;object-fit:contain;cursor:zoom-in}.details{padding:16px}.caption{white-space:pre-wrap;overflow-wrap:anywhere;min-height:44px;margin:0 0 10px;line-height:1.5;font-size:15px}.meta{font-size:12px;color:#68778b;line-height:1.8}.badge{display:inline-block;padding:3px 7px;border-radius:5px;background:#edf2f7;font-size:11px;margin-top:10px}.badge.saved{background:#e9f5ee;color:#237042}.badge.error,.badge.deleting{background:#fff0e0;color:#96510a}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}.actions button,.actions a{padding:7px 9px;font-size:12px}.danger{color:#ae3434}.error-note{color:#a75b24;font-size:12px;line-height:1.5;margin:8px 0 0}.empty{grid-column:1/-1;text-align:center;padding:80px 20px;background:#fff;border:1px dashed #d5dce6;border-radius:12px;color:#6a7788}.pagination{display:flex;gap:18px;align-items:center;justify-content:center;margin:28px 0;font-size:13px}.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#1d2a3d;color:#fff;border-radius:9px;padding:13px 20px;max-width:90vw;z-index:5;font-size:14px;box-shadow:0 5px 24px #0003}.toast[hidden]{display:none}dialog{padding:12px;border:0;border-radius:12px;max-width:94vw;max-height:94vh}dialog::backdrop{background:#0d1729b8}dialog img{display:block;max-width:88vw;max-height:78vh;object-fit:contain}dialog button{display:block;margin:10px 0 0 auto}footer{color:#7a8697;font-size:12px;line-height:1.7;margin-top:22px}@media(max-width:600px){header{padding:20px}main{padding:18px}.connection{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.toolbar .count{width:100%;margin-left:0}.preview{height:250px}}
</style>
<script src="/photos.js" defer></script>
</head>
<body>
<header><div><h1>사진 보관함</h1><p>모니터에 전한 사진과 문구를 한곳에</p></div><a href="/">← 콘트롤 센터</a></header>
<main>
<section id="connection" class="connection" aria-live="polite"><div><strong id="connectionTitle">보관 상태 확인 중</strong><p id="connectionText">사진 목록을 불러오고 있습니다.</p><a id="driveLink" target="_blank" rel="noopener noreferrer">드라이브 폴더 열기 ↗</a></div><a id="connect" class="button primary" href="/api/photos/oauth/start" hidden>Google 계정 연결</a></section>
<div class="toolbar"><label>등록 날짜 <input id="date" type="date"></label><button id="all">전체 날짜</button><button id="refresh">새로고침</button><span class="count" id="count"></span></div>
<div id="grid" class="grid" aria-live="polite"></div>
<div class="pagination"><button id="prev">이전</button><span id="page"></span><button id="next">다음</button></div>
<footer>등록일시는 한국 시간 기준입니다. 라이브 송출을 종료해도 보관 사진은 유지됩니다.<br>삭제한 드라이브 파일은 휴지통으로 이동합니다. 사진 복사는 이미지 붙여넣기를 지원하는 앱에서 사용할 수 있습니다.</footer>
</main>
<dialog id="preview"><img id="previewImage" alt="사진 크게 보기"><button id="closePreview">닫기</button></dialog>
<div id="toast" class="toast" role="status" hidden></div>
</body></html>
